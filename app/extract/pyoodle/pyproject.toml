[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoodle"
version = "0.1.0"
description = "Decompress RAD/Oodle COMPRESS-framed containers (NRadEngine asset packages)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dualgame" }]
keywords = ["oodle", "decompression", "nradengine", "lone-echo", "echo-vr"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://example.invalid/pyoodle"

[tool.setuptools.packages.find]
include = ["pyoodle*"]
